name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0'

      - name: Rebuild project with proper Flutter structure
        run: |
          CURRENT_DIR=$(pwd)
          CURRENT_NAME=$(basename "$CURRENT_DIR")
          cd ..
          mv "$CURRENT_NAME" "${CURRENT_NAME}_backup"
          flutter create --platforms android --org com.suqi --project-name navigation_panel "$CURRENT_NAME"
          cd "$CURRENT_NAME"
          # Restore custom Dart code and config
          rm -rf lib
          cp -r "../${CURRENT_NAME}_backup/lib" lib
          cp "../${CURRENT_NAME}_backup/pubspec.yaml" pubspec.yaml
          cp "../${CURRENT_NAME}_backup/README.md" README.md
          rm -rf .github
          cp -r "../${CURRENT_NAME}_backup/.github" .github
          # Fix Android Gradle Plugin version for webview compatibility
          sed -i 's|id "com.android.application" version "8.1.0" apply false|id "com.android.application" version "8.2.0" apply false|' android/settings.gradle
          # Fix Gradle version for Java 21 compatibility
          sed -i 's|gradle-8.2-all.zip|gradle-8.5-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Apply Android customizations
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          # Cleanup
          rm -rf "../${CURRENT_NAME}_backup"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
