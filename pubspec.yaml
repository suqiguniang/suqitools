name: navigation_panel
description: A navigation panel app for accessing web services.
publish_to: 'none'
version: 1.2.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.0
  package_info_plus: ^5.0.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # App icon configuration
  # Icons are placed in android/app/src/main/res/mipmap-*/ic_launcher.png
